<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Graduation Project Registration System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth-shared.css">
  <link rel="stylesheet" href="../css/pages/register.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="auth-layout">
    <!-- Illustration Panel (always on the left) -->
    <div class="auth-left">
      <div class="auth-left-dots">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="auth-left-dots auth-left-dots-bottom">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <div class="auth-logo">
        <h1>Graduation Project<br>Registration System</h1>
      </div>

      <div class="auth-illustration-wrap">
        <img src="../assets/images/logo.png" alt="" loading="lazy">
      </div>
    </div>

    <!-- Form Panel -->
    <div class="auth-right">
      <div class="auth-form-container">
        <h2 class="auth-form-title">Create a New Account</h2>
        <p class="auth-form-subtitle">Create your account now to continue</p>

        <div id="register-alert" class="alert alert-danger hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>
          </svg>
          <span id="register-alert-msg"></span>
        </div>

        <div id="register-success" class="alert alert-success hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          <span>✅ Account created successfully! Redirecting to login...</span>
        </div>

        <form id="register-form" novalidate>
          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="fullName">Full Name</label>
            <input type="text" class="form-control" id="fullName" placeholder="Enter your full name in Arabic (exactly 4 names)" autocomplete="name" dir="rtl">
            <div class="form-error" id="fullName-error"></div>
          </div>

          <!-- Faculty ID -->
          <div class="form-group">
            <label class="form-label" for="facultyId">Student ID</label>
            <input type="text" class="form-control" id="facultyId" placeholder="Enter your student ID" maxlength="20" autocomplete="off" dir="ltr" style="direction: ltr; text-align: left;">
            <div class="form-error" id="facultyId-error"></div>
          </div>

          <!-- National ID -->
          <div class="form-group">
            <label class="form-label" for="nationalId">National ID</label>
            <input type="text" class="form-control" id="nationalId" placeholder="Enter your national ID (14 digits)" maxlength="14" autocomplete="off">
            <div class="form-error" id="nationalId-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="register-btn">
            Create Account
          </button>
        </form>

        <p class="auth-link-text">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/api/runtime-config.js"></script>
  <script src="../js/config.js?v=3"></script>
  <script src="../js/storage.js?v=3"></script>
  <script src="../js/api.js?v=3"></script>
  <script src="../js/validation.js?v=3"></script>
  <script src="../js/animations.js?v=3"></script>
  <script src="../js/pages/register.js?v=3"></script>
</body>
</html>
