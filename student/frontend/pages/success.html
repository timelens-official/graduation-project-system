<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Complete - Graduation Project Registration System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages/success.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <!-- Shared App Shell: Sidebar + Topbar (see js/components/layout.js) -->
  <div id="app-shell" data-topbar-title="Registration Complete"></div>
  <script src="../js/components/layout.js?v=3"></script>

  <main class="main-content">
    <div class="success-container">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <h1 class="success-title">Registration Successful</h1>
      <h2 class="success-subtitle">Thank you!</h2>
      <p class="success-desc">Your graduation project has been registered successfully and is now pending review by the academic supervisors.</p>
      
      <div class="success-actions">
        <a href="dashboard.html" class="btn btn-primary btn-lg">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Back to Home
        </a>
        <a href="project-details.html" class="btn btn-outline">
          View Project Details
        </a>
      </div>

      <!-- Confetti -->
      <div id="confetti-container" class="confetti-container"></div>
    </div>
  </main>

  <div class="modal-backdrop" id="logout-modal">
    <div class="modal">
      <div class="modal-icon modal-icon-danger">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#DC2626" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <h3 class="modal-title">Logout</h3>
      <p class="modal-body">Are you sure?</p>
      <div class="modal-actions">
        <button class="btn btn-danger" id="confirm-logout">Logout</button>
        <button class="btn btn-secondary" id="cancel-logout">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/api/runtime-config.js"></script>
  <script src="../js/config.js?v=3"></script>
  <script src="../js/storage.js?v=3"></script>
  <script src="../js/api.js?v=3"></script>
  <script src="../js/animations.js?v=3"></script>
  <script src="../js/main.js?v=3"></script>
  <script src="../js/pages/success.js?v=3"></script>
</body>
</html>
