<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Graduation Project Registration System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth-shared.css">
  <link rel="stylesheet" href="../css/pages/login.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="auth-layout">
    <!-- Illustration Panel (always on the left) -->
    <div class="auth-left">
      <div class="auth-left-dots">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="auth-left-dots auth-left-dots-bottom">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <div class="auth-logo">
        <h1>Graduation Project<br>Registration System</h1>
      </div>

      <div class="auth-illustration-wrap">
        <img src="../assets/images/logo.png" alt="" loading="lazy">
      </div>
    </div>

    <!-- Form Panel -->
    <div class="auth-right">
      <div class="auth-form-container">
        <h2 class="auth-form-title">Login</h2>
        <p class="auth-form-subtitle">Please enter your details to continue</p>

        <div id="login-alert" class="alert alert-danger hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>
          </svg>
          <span id="login-alert-msg"></span>
        </div>

        <form id="login-form" novalidate>
          <!-- Faculty ID -->
          <div class="form-group">
            <label class="form-label" for="facultyId">Username</label>
            <input type="text" class="form-control" id="facultyId" placeholder="Enter your student ID" maxlength="20" autocomplete="username">
            <div class="form-error" id="facultyId-error"></div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password">
              <span>Password</span>
            </label>
            <div class="password-field">
              <input type="password" class="form-control" id="password" placeholder="National ID (14 digits)" autocomplete="current-password" maxlength="14">
              <button type="button" class="password-toggle" id="toggle-password" aria-label="Show/hide password">
                <svg id="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="form-error" id="password-error"></div>
          </div>

          <!-- User Type Selector -->
          <div class="form-group">
            <label class="form-label">Login As</label>
            <div class="role-selector-inline" role="radiogroup" aria-label="User type">
              <label class="role-option" for="role-student">
                <input type="radio" name="userRole" id="role-student" value="student" checked>
                <span>Student</span>
              </label>
              <label class="role-option" for="role-admin">
                <input type="radio" name="userRole" id="role-admin" value="admin">
                <span>Admin</span>
              </label>
              <label class="role-option" for="role-staff">
                <input type="radio" name="userRole" id="role-staff" value="staff">
                <span>Staff</span>
              </label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-pill" id="login-btn">
            Login
          </button>
        </form>

        <p class="auth-link-text" id="create-account-link">
          Don't have an account? <a href="register.html">Create a new account</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/api/runtime-config.js"></script>
  <script src="../js/config.js?v=3"></script>
  <script src="../js/storage.js?v=3"></script>
  <script src="../js/api.js?v=3"></script>
  <script src="../js/validation.js?v=3"></script>
  <script src="../js/animations.js?v=3"></script>
  <script src="../js/pages/login.js?v=3"></script>
</body>
</html>
