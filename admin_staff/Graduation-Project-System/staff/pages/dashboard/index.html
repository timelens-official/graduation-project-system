<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduation Projects Review - Dashboard</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Shared Styles -->
    <link rel="stylesheet" href="../../shared/css/reset.css">
    <link rel="stylesheet" href="../../shared/css/layout.css">
    <!-- Page Custom Style -->
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="app-layout">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-graduation-cap sidebar-logo"></i>
                <h2>Graduation Projects<br>Review System</h2>
            </div>
            
            <hr class="sidebar-divider">

            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="../dashboard/index.html" class="active">
                            <i class="fa-solid fa-house"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="../developers/index.html">
                            <i class="fa-solid fa-users"></i>
                            <span>About Developers</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" id="staffLogoutBtn">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span>Logout</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-illustration">
            <img src="../../shared/assests/image.png" alt="Illustration">
        </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Topbar Header -->
            <div class="topbar">
                <button type="button" class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Toggle menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="user-profile-badge">
                    <i class="fa-solid fa-circle-user"></i>
                    <span id="loggedInDoctorName">Dr. Mostafa Shobeir</span>
                </div>
                <div class="breadcrumb-title">
                    <i class="fa-solid fa-house"></i>
                    <span>Home Page</span>
                </div>
            </div>

            <!-- Dashboard Content -->
            <section class="projects-section">
                <div class="section-header-title">
                    <i class="fa-solid fa-file-lines"></i>
                    <h2>Assigned Projects For Review</h2>
                </div>

                <!-- Dynamic Projects Container -->
                <div id="staffProjectsContainer" class="projects-grid">
                    <!-- Cards or "No Assigned Projects" message rendered via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- JS Files -->
    <script src="/api/runtime-config.js"></script>
    <script src="../../shared/js/api.js?v=1"></script>
<script src="../../shared/js/layout.js?v=1"></script>
    <script src="dashboard.js?v=1"></script>
</body>
</html>
