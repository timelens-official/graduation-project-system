    <link rel="stylesheet" href="../../shared/css/reset.css">
    <link rel="stylesheet" href="../../shared/css/layout.css">
    <link rel="stylesheet" href="../../shared/css/components.css">
    <link rel="stylesheet" href="users-programs.css">
</head>
<body>
<div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-graduation-cap sidebar-logo"></i>
            <h2>Graduation Project<br>Management System</h2>
        </div>
        
        <hr class="sidebar-divider">

        <nav class="sidebar-nav">
            <ul>
                <li><a href="../dashboard/index.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
                <li><a href="../users-programs/index.html" class="active"><i class="fa-solid fa-user-plus"></i><span>Staff and Programs</span></a></li>
                <li><a href="../projects/index.html"><i class="fa-solid fa-briefcase"></i><span>Projects</span></a></li>
                <li><a href="../reports/index.html"><i class="fa-solid fa-file-lines"></i><span>Reports</span></a></li>
                <li><a href="../developers/index.html"><i class="fa-solid fa-user-group"></i><span>About Developers</span></a></li>
                <li><a href="#"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></li>
            </ul>

        <div class="sidebar-illustration">
            <img src="../../shared/assests/image.png" alt="Graduation Illustration">
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <button type="button" class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Toggle menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="topbar-title">
                <h1><i class="fa-solid fa-briefcase"></i> Staff and Programs</h1>
            </div>
        </header>

        <!-- Toast Notification Alert (حطه فوق السكشن) -->
<div id="toastNotification" class="toast-popup"></div>

<!-- Faculty Staff Management -->
<section class="admin-section-card animate-fade-up">
    <div class="section-title-wrapper">
        <i class="fa-solid fa-user-plus"></i>
        <h2>Faculty Staff Management</h2>
    </div>

    <form class="inline-form" id="addStaffForm">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="staffFullName" placeholder="Enter full name" required 
                            pattern="[A-Za-z0-9 ]{3,50}" 
                            title="English letters, numbers, and spaces only (min 3)">

        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="staffUsername" placeholder="Enter username" required 
                pattern="[A-Za-z0-9@._-]{1,30}" 
                title="English letters, numbers, and @ . _ - only (max 30)">

        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="password-field-wrapper">
                <input type="password" id="staffPassword" placeholder="Enter password" required 
                        pattern="[A-Za-z0-9@#$%^&+=!]{6,30}" 
                        title="English letters, numbers, and special characters (@ # $ % ^ & + = !) only (min 6)">

                <button type="button" class="password-toggle-btn" id="toggleStaffPassword" aria-label="Show/hide password">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn-primary-custom">Add Member</button>
    </form>

    <div class="table-subtitle">
        <i class="fa-solid fa-users"></i>
        <span>Current Staff Members</span>
    </div>

    <div class="custom-table-container">
        <table class="custom-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th style="width: 120px;">Actions</th>
                </tr>
            </thead>
            <tbody id="staffTableBody">
                <!-- الـ Dynamic Staff هيتضافوا هنا -->
            </tbody>
        </table>
    </div>
</section>
        <!-- 2. Programs Management -->
        <section class="admin-section-card animate-fade-up">
            <div class="section-title-wrapper">
                <i class="fa-solid fa-graduation-cap"></i>
                <h2>Programs Management</h2>
            </div>

            <form class="inline-form" id="addProgramForm">
                <div class="form-group">
                    <label>Program Name</label>
                    <input type="text" placeholder="Enter program name" required>
                </div>
                <button type="submit" class="btn-primary-custom">Add Program</button>
            </form>

            <div class="table-subtitle">
                <i class="fa-solid fa-users"></i>
                <span>Current Programs</span>
            </div>

            <div class="custom-table-container">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Program Name</th>
                            <th style="width: 120px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="programsTableBody">
                        <!-- Rendered dynamically from ProgramsStorage (see programs-database.js) -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="/api/runtime-config.js"></script>
<script src="../../shared/js/api.js?v=1"></script>
<script src="../../shared/js/staff-database.js?v=1"></script>
<script src="../../shared/js/programs-database.js?v=1"></script>
<script src="../../shared/js/layout.js?v=1"></script>
<script src="../../shared/js/animations.js?v=1"></script>
<script src="users-programs.js?v=1"></script>
