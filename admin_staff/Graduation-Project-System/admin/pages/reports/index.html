<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Graduation Project Management System</title>
    
    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="../../shared/css/reset.css">
    <link rel="stylesheet" href="../../shared/css/layout.css">
    <link rel="stylesheet" href="../../shared/css/components.css">
    
    <!-- Page Specific Style -->
    <link rel="stylesheet" href="reports.css">
</head>
<body>

    <div class="app-layout">
        
        <!-- Standard Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-graduation-cap sidebar-logo"></i>
                <h2>Graduation Project<br>Management System</h2>
            </div>

            <hr class="sidebar-divider">

            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="../dashboard/index.html">
                            <i class="fa-solid fa-house"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="../users-programs/index.html">
                            <i class="fa-solid fa-user-plus"></i>
                            <span>Staff and Programs</span>
                        </a>
                    </li>
                    <li>
                        <a href="../projects/index.html">
                            <i class="fa-solid fa-briefcase"></i>
                            <span>Projects</span>
                        </a>
                    </li>
                    <li>
                        <a href="../reports/index.html" class="active">
                            <i class="fa-solid fa-file-lines"></i>
                            <span>Reports</span>
                        </a>
                    </li>
                    <li>
                        <a href="../developers/index.html">
                            <i class="fa-solid fa-user-group"></i>
                            <span>About Developers</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span>Logout</span>
                        </a>
                    </li>
                </ul>

                <div class="sidebar-illustration">
                    <img src="../../shared/assests/image.png" alt="Illustration">
                </div>
            </nav>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- Topbar Header -->
            <div class="topbar">
    <button type="button" class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Toggle menu">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div class="topbar-title">
        <h1>
            <i class="fa-solid fa-file-lines"></i>
            <span>Reports</span>
        </h1>
    </div>
    
    <div class="topbar-filters">
        <select class="custom-select" id="academicYearFilter">
            <option value="">Department Year</option>
            <option value="2026-2027">2026/2027</option>
        </select>

        <select class="custom-select" id="programFilter">
            <option value="">Program</option>
        </select>
    </div>
</div>

<div class="reports-cards-grid">
    
    <div class="report-card">
        <div class="report-icon-box excel-icon">
            <i class="fa-solid fa-file-excel"></i>
        </div>
        <h2 class="report-title">EXCEL Report</h2>
        <p class="report-desc">
            An EXCEL file containing all projects and team details (in one sheet).
        </p>
        <button class="btn-generate-report" id="btnGenerateExcel">
            <i class="fa-solid fa-file-excel"></i>
            <span>Generate EXCEL Report</span>
        </button>
    </div>

    <div class="report-card ">
        <div class="report-icon-box pdf-icon">
            <i class="fa-solid fa-file-pdf"></i>
        </div>
        <h2 class="report-title">PDF Report</h2>
        <p class="report-desc">
            Print-ready PDF file with each project on a separate page.
        </p>
        <button class="btn-generate-report" id="btnGeneratePdf">
            <i class="fa-solid fa-file-pdf"></i>
            <span>Generate PDF Report</span>
        </button>
    </div>

</div>
<script src="/api/runtime-config.js"></script>
<script src="../../shared/js/api.js?v=1"></script>
<script src="../../shared/js/layout.js?v=1"></script>
<script src="../../shared/js/animations.js?v=1"></script>
<script src="reports.js?v=1"></script>
</body>
</html>
