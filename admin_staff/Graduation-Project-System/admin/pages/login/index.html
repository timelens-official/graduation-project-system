<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Graduation Project Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/css/reset.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <i class="fa-solid fa-graduation-cap login-logo"></i>
                <h1>Graduation Project<br>Management System</h1>
                <p>Admin Sign In</p>
            </div>

            <div id="loginError" class="login-error"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="20" pattern="[A-Za-z0-9_]{1,20}" title="Up to 20 letters, numbers, and underscores">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-field-wrapper">
                        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" id="togglePassword" aria-label="Show/hide password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
            </form>
        </div>
    </div>

    <script src="/api/runtime-config.js"></script>
    <script src="../../shared/js/api.js?v=1"></script>
    <script src="login.js?v=1"></script>
</body>
</html>
