<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Graduation Project Management System</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet">
    
    <!-- Shared Styles -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../shared/css/reset.css">
    <link rel="stylesheet" href="../../shared/css/layout.css">
    <link rel="stylesheet" href="../../shared/css/components.css">
    
    <!-- Dashboard Custom Styles -->
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-graduation-cap sidebar-logo"></i>
            <h2>Graduation Projects<br>Management System</h2>
        </div>

        <hr class="sidebar-divider">

        <nav class="sidebar-nav">
            <ul>
                <li>
                    <a href="../dashboard/index.html" class="active">
                        <i class="fa-solid fa-house"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="../users-programs/index.html">
                        <i class="fa-solid fa-user-plus"></i>
                        <span>Staff and Programs</span>
                    </a>
                </li>
                <li>
                    <a href="../projects/index.html">
                        <i class="fa-solid fa-briefcase"></i>
                        <span>Projects</span>
                    </a>
                </li>
                <li>
                    <a href="../reports/index.html">
                        <i class="fa-solid fa-file-lines"></i>
                        <span>Reports</span>
                    </a>
                </li>
                <li>
                    <a href="../developers/index.html">
                        <i class="fa-solid fa-user-group"></i>
                        <span>About Developers</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>

            <!-- الصورة التوضيحية تحت -->
            <div class="sidebar-illustration">
                <img src="../../shared/assests/image.png" alt="Illustration">
            </div>
        </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content Area -->
        <main class="main-content">

            <div class="topbar">
    <button type="button" class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Toggle menu">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div class="topbar-title">
        <h1>
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </h1>
    </div>
    
    <div class="topbar-filters">
        <select class="custom-select" id="academicYearFilter">
            <option value="">Department Year</option>
            <option value="2026-2027">2026/2027</option>
        </select>
        
        <select class="custom-select" id="programFilter">
            <option value="">Program</option>
        </select>
    </div>
</div>
        <div class="stats-grid">
    <!-- Total Projects -->
    <div class="stat-card">
        <div class="stat-title">Total Projects</div>
        <div class="stat-bottom-row">
            <div class="stat-icon-wrapper">
                <i class="fa-solid fa-folder"></i>
            </div>
            <div class="stat-number" id="totalProjectsCount">34</div>
        </div>
        <div class="stat-caption">Project registered</div>
    </div>

    <!-- Total Students -->
    <div class="stat-card">
        <div class="stat-title">Total Students</div>
        <div class="stat-bottom-row">
            <div class="stat-icon-wrapper">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="stat-number" id="totalStudentsCount">235</div>
        </div>
        <div class="stat-caption">Student registered</div>
    </div>

    <!-- Total Teams -->
    <div class="stat-card">
        <div class="stat-title">Total Teams</div>
        <div class="stat-bottom-row">
            <div class="stat-icon-wrapper">
                <i class="fa-solid fa-users"></i>
            </div>
            <div class="stat-number" id="totalTeamsCount">34</div>
        </div>
        <div class="stat-caption">Team registered</div>
    </div>
</div>

            <!-- Registration Status Card -->
            <div class="registration-main-card">
                <h2 class="reg-card-title">Registration Status</h2>
                
                <div class="reg-status-body" id="regStatusContainer">
                    <!-- Dynamic status via JS -->
                </div>

                <button class="btn-toggle-reg" id="toggleRegBtn">Close Registration</button>
            </div>

        </main>

    </div>

    <!-- Scripts -->
    <script src="/api/runtime-config.js"></script>
    <script src="../../shared/js/api.js?v=1"></script>
<script src="../../shared/js/layout.js?v=1"></script>
    <script src="../../shared/js/storage.js?v=1"></script>
    <script src="dashboard.js?v=1"></script>
</body>
</html>
